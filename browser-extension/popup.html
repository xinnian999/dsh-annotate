<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>dsh-annotate</title>
<style>
  body { width: 300px; margin: 0; padding: 16px; color: #111827; font: 13px system-ui, sans-serif; }
  h1 { margin: 0 0 12px; font-size: 17px; }
  label { display: block; margin: 10px 0 4px; font-weight: 600; }
  input { box-sizing: border-box; width: 100%; padding: 7px 8px; border: 1px solid #d1d5db; border-radius: 6px; }
  button { margin-top: 10px; padding: 7px 12px; border: 0; border-radius: 6px; background: #4d6bfe; color: white; cursor: pointer; }
  code { user-select: all; font-size: 11px; }
  #saved { margin-left: 8px; color: #047857; }
</style>
<h1>dsh-annotate</h1>
<label for="endpoint">Harness bridge</label>
<input id="endpoint" value="ws://127.0.0.1:43119">
<button id="save">Save and reconnect</button><span id="saved"></span>
<p>Extension ID: <code id="extension-id"></code></p>
<p>Run <code>/annotate</code> in DeepSeek Harness, then select elements on the page.</p>
<script src="popup.js"></script>
</html>
